name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'GestorFinancas_compilacao_GitHub (1)/GestorFinancas.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -q "GestorFinancas_compilacao_GitHub (1)/GestorFinancas.zip"

      - name: Compilar APK
        run: gradle -p GestorFinancas/GestorFinancas assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorFinancas-APK
          path: GestorFinancas/GestorFinancas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
