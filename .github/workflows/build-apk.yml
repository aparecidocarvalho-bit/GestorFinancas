name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'GestorFinancas_compilacao_GitHub (1)/GestorFinancas.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir arquivos do repositório
        run: ls -la

      - name: Extrair projeto
        run: unzip -o "GestorFinancas_compilacao_GitHub (1)/GestorFinancas.zip" -d projeto

      - name: Localizar projeto Android
        run: find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        run: |
          echo "Precisamos confirmar a pasta do projeto Android antes de compilar."
          find projeto -type f -name gradlew -print
          find projeto -type f -name build.gradle -o -name build.gradle.kts
